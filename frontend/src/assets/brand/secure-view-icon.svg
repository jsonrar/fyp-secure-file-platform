<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 128 128"
     role="img"
     aria-labelledby="title desc"
     fill="none">
  <title id="title">Secure View icon</title>
  <desc id="desc">A symmetrical shield with a protected-view eye and a folded document corner.</desc>

  <defs>
    <mask id="shield-cutouts"
          x="0" y="0" width="128" height="128"
          maskUnits="userSpaceOnUse">
      <rect width="128" height="128" fill="#fff"/>

      <!-- Eye-shaped negative space, mirrored around x=64. -->
      <path d="M26 65C36 50 49 44 64 44s28 6 38 21c-10 15-23 21-38 21S36 80 26 65Z"
            fill="#000"/>

      <!-- Folded-file corner: an internal detail that does not reshape the shield. -->
      <path d="M83 16v15c0 5 4 9 9 9h15"
            fill="none"
            stroke="#000"
            stroke-width="5"
            stroke-linecap="round"
            stroke-linejoin="round"/>
    </mask>
  </defs>

  <!-- The outer contour is mathematically symmetrical around x=64. -->
  <path d="M64 8l41 17c2 1 3 3 3 5v30c0 28-17 49-44 61C37 109 20 88 20 60V30c0-2 1-4 3-5L64 8Z"
        fill="currentColor"
        mask="url(#shield-cutouts)"/>

  <!-- Keyhole pupil. -->
  <circle cx="64" cy="59" r="9" fill="currentColor"/>
  <path d="M59.5 65.5h9L72 80H56l3.5-14.5Z" fill="currentColor"/>
</svg>
