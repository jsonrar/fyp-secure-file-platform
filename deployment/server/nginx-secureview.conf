# Tracked copy of /etc/nginx/sites-available/fyp-secure-file-platform on the
# MCS21 staging VPS.
#
# The 443 block is the real site. The 80 block exists only to redirect browsers
# and to answer the two release probes; see docs/DEPLOYMENT.md section 5.
#
# Lines marked "managed by Certbot" were written by `certbot --nginx`. Re-running
# certbot rewrites them, so re-apply the loopback probe exception afterwards and
# compare against this file.
#
# Certificate paths assume `certbot --nginx -d secureview.tech -d www.secureview.tech`
# has already issued into /etc/letsencrypt/live/secureview.tech/.

server {
    server_name secureview.tech www.secureview.tech 103.233.0.105;

    root /opt/mcs21/current/frontend/dist;
    index index.html;

    server_tokens off;
    client_max_body_size 26m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        include /etc/nginx/proxy_params;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health/live {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    location = /openapi.json {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/secureview.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/secureview.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.secureview.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = secureview.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name secureview.tech www.secureview.tech 103.233.0.105;

    # The release tooling probes http://127.0.0.1/health/live and
    # http://127.0.0.1/ with a bare-IP Host header, which the certbot redirects
    # above do not match. Keep exactly those two reachable, and only from
    # loopback, so an external client on the bare IP still gets nothing over
    # cleartext HTTP.
    root /opt/mcs21/current/frontend/dist;

    location = /health/live {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    location = / {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        try_files /index.html =404;
    }

    location / {
        return 404; # managed by Certbot
    }




}