# Tracked copy of /etc/fail2ban/jail.d/secureview.conf on the MCS21 staging VPS.
#
# SecureView had no jail at all: the two nginx jails on this host both read
# monash-tracker.error.log, which is a different project on the same server.

[secureview-auth]
enabled  = true
port     = http,https
filter   = secureview-auth
logpath  = /var/log/nginx/secureview.access.log
# Twenty rejected credentials in ten minutes is not a person mistyping a password. The ban
# is an hour: long enough to make guessing pointless, short enough that a teammate who
# locked themselves out is not stuck for the evening.
maxretry = 20
findtime = 600
bantime  = 3600
