# Tracked copy of /etc/fail2ban/filter.d/secureview-auth.conf on the MCS21 staging VPS.
#
# Matches a rejected credential on this site's access log. The application already blocks an
# account after ten failures and an IP after fifty, and nginx now rate-limits the same routes
# -- this is the third layer, and the only one that stops the host from talking to the
# attacker at all.
#
# 401 covers a wrong password or a rejected refresh token; 429 means they were already
# hitting the nginx limit and kept going, which no legitimate client does.

[Definition]
failregex = ^<HOST> .*"(GET|POST) /api/v1/auth/[^"]*" (401|429) 
ignoreregex =
datepattern = %%d/%%b/%%Y:%%H:%%M:%%S %%z
