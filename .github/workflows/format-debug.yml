name: format-debug

on:
  push:
    branches: [ops/observability-audit-checkpoints]

jobs:
  diff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.18
      - name: Show Ruff formatting diff
        run: ruff format --diff app/api/error_handlers.py scripts/audit_checkpoint.py scripts/ops_monitor.py
