name: Format issue 59 scripts

on:
  pull_request:
    paths:
      - "backend/scripts/audit_checkpoint.py"
      - "backend/scripts/observe_runtime.py"
      - ".github/workflows/format-issue59.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.18
      - run: ruff format backend/scripts/audit_checkpoint.py backend/scripts/observe_runtime.py
      - name: Commit formatter output if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/scripts/audit_checkpoint.py backend/scripts/observe_runtime.py
          git commit -m "Apply Ruff formatter to observability scripts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
