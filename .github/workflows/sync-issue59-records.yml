name: Sync issue 59 product records

on:
  push:
    branches:
      - ops/issue-59-observability

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Match current Chinese TODO wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/sync_issue59_records.py')
          t = p.read_text(encoding='utf-8')
          t = t.replace('#59 新增脱敏可观测性', '#59 增加脱敏可观测性')
          t = t.replace('让运维与审计失败可见，同时不泄露 Secret。', '让运维和审计失败可见，同时不泄露 Secret。')
          p.write_text(t, encoding='utf-8')
          PY
      - run: python .github/sync_issue59_records.py
      - name: Commit synchronized records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changelog/CHANGELOG.md README.md README.zh-CN.md TODO.md TODO.zh-CN.md
          git diff --cached --quiet && exit 0
          git commit -m "Synchronize issue 59 product records"
          git push origin HEAD:ops/issue-59-observability
