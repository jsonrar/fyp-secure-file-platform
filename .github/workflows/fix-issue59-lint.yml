name: Fix issue 59 lint

on:
  push:
    branches:
      - ops/issue-59-observability

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.18
      - run: ruff check --fix --unsafe-fixes backend/scripts/audit_checkpoint.py backend/scripts/observe_runtime.py
      - run: ruff format backend/scripts/audit_checkpoint.py backend/scripts/observe_runtime.py
      - name: Commit fixes if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/scripts/audit_checkpoint.py backend/scripts/observe_runtime.py
          git commit -m "Apply Ruff lint fixes to observability scripts"
          git push origin HEAD:ops/issue-59-observability
